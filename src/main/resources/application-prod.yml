server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:xingmang-producer-group}

xingmang:
  rocketmq:
    moments-consumer:
      enabled: ${MOMENTS_CONSUMER_ENABLED:true}

minio:
  endpoint: ${MINIO_ENDPOINT}
  publicEndpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucketName: ${MINIO_BUCKET_NAME:xingmang-api}
  uploadUrlExpireSeconds: ${MINIO_UPLOAD_URL_EXPIRE_SECONDS:3600}
  viewUrlExpireSeconds: ${MINIO_VIEW_URL_EXPIRE_SECONDS:3600}

baidu:
  body-analysis:
    app-id: ${BAIDU_BODY_APP_ID:}
    api-key: ${BAIDU_BODY_API_KEY:}
    secret-key: ${BAIDU_BODY_SECRET_KEY:}
    connection-timeout-millis: ${BAIDU_CONNECTION_TIMEOUT_MILLIS:2000}
    socket-timeout-millis: ${BAIDU_SOCKET_TIMEOUT_MILLIS:60000}

logging:
  level:
    com.example.xingmang: INFO
    org.apache.ibatis: WARN
